openapi: 3.1.0
info:
  title: keeper.sh API
  description: |
    The keeper.sh API. Internal session-authenticated endpoints are used by the
    web dashboard. The public v1 API (`/api/v1/**`) uses Bearer token
    authentication via API tokens created at `POST /api/tokens`.
  version: 1.0.0

servers:
  - url: https://keeper.sh

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: HttpOnly session cookie set by Better Auth after sign-in.
    bearerToken:
      type: http
      scheme: bearer
      description: API token created via `POST /api/tokens`.

  schemas:
    # -------------------------------------------------------------------------
    # Core domain types
    # -------------------------------------------------------------------------
    KeeperSource:
      type: object
      required:
        - id
        - name
        - calendarType
        - capabilities
        - accountId
        - provider
        - accountIdentifier
        - needsReauthentication
        - includeInIcalFeed
        - providerName
        - accountLabel
      properties:
        id:
          type: string
        name:
          type: string
        calendarType:
          type: string
        capabilities:
          type: array
          items:
            type: string
        accountId:
          type: string
        provider:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        accountIdentifier:
          type: string
        needsReauthentication:
          type: boolean
        includeInIcalFeed:
          type: boolean
        providerName:
          type: string
        providerIcon:
          type: string
          nullable: true
        accountLabel:
          type: string

    KeeperDestination:
      type: object
      required:
        - id
        - provider
        - needsReauthentication
      properties:
        id:
          type: string
        provider:
          type: string
        email:
          type: string
          nullable: true
        needsReauthentication:
          type: boolean

    KeeperMapping:
      type: object
      required:
        - id
        - sourceCalendarId
        - destinationCalendarId
        - createdAt
        - calendarType
      properties:
        id:
          type: string
        sourceCalendarId:
          type: string
        destinationCalendarId:
          type: string
        createdAt:
          type: string
          format: date-time
        calendarType:
          type: string

    KeeperEvent:
      type: object
      required:
        - id
        - startTime
        - endTime
        - calendarId
        - calendarName
        - calendarProvider
      properties:
        id:
          type: string
        eventStateId:
          type: string
          nullable: true
          description: Persisted event_states UUID for synced events; null for user-created events.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        calendarId:
          type: string
        calendarName:
          type: string
        calendarProvider:
          type: string
        calendarUrl:
          type: string
          nullable: true

    KeeperSyncStatus:
      type: object
      required:
        - calendarId
        - inSync
        - localEventCount
        - remoteEventCount
      properties:
        calendarId:
          type: string
        inSync:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        localEventCount:
          type: integer
        remoteEventCount:
          type: integer

    PendingInvite:
      type: object
      required:
        - sourceEventUid
        - startTime
        - endTime
        - isAllDay
        - calendarId
        - provider
      properties:
        sourceEventUid:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isAllDay:
          type: boolean
        organizer:
          type: string
          nullable: true
        calendarId:
          type: string
        provider:
          type: string

    Entitlements:
      type: object
      required:
        - accountCount
        - accountLimit
        - mappingCount
        - mappingLimit
        - plan
        - canUseEventFilters
        - canCustomizeIcalFeed
      properties:
        accountCount:
          type: integer
        accountLimit:
          type: integer
        mappingCount:
          type: integer
        mappingLimit:
          type: integer
        plan:
          type: string
          enum: [free, pro]
        canUseEventFilters:
          type: boolean
        canCustomizeIcalFeed:
          type: boolean

    IcalSettings:
      type: object
      required:
        - includeEventName
        - includeEventDescription
        - includeEventLocation
        - excludeAllDayEvents
        - customEventName
      properties:
        includeEventName:
          type: boolean
        includeEventDescription:
          type: boolean
        includeEventLocation:
          type: boolean
        excludeAllDayEvents:
          type: boolean
        customEventName:
          type: string

    ApiToken:
      type: object
      required:
        - id
        - name
        - prefix
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Success:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    AuthSession:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        userId:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthSessionResponse:
      type: object
      properties:
        session:
          oneOf:
            - $ref: "#/components/schemas/AuthSession"
            - type: "null"
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/auth/capabilities:
    get:
      operationId: getAuthCapabilities
      summary: Get server auth capabilities
      description: Returns which authentication methods are available. Call this first to determine the correct sign-in flow.
      tags: [Auth]
      responses:
        "200":
          description: Auth capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                  - commercialMode
                  - credentialMode
                  - requiresEmailVerification
                  - socialProviders
                  - supportsChangePassword
                  - supportsPasskeys
                  - supportsPasswordReset
                properties:
                  commercialMode:
                    type: boolean
                    description: When true, email/password auth is used instead of username/password
                  credentialMode:
                    type: string
                    enum: [username, email]
                  requiresEmailVerification:
                    type: boolean
                  socialProviders:
                    type: object
                    properties:
                      google:
                        type: boolean
                      microsoft:
                        type: boolean
                  supportsChangePassword:
                    type: boolean
                  supportsPasskeys:
                    type: boolean
                  supportsPasswordReset:
                    type: boolean

  /api/auth/username-only/sign-up:
    post:
      operationId: usernameSignUp
      summary: Sign up with username and password
      description: Active when `commercialMode` is false (self-hosted). Creates an account and starts a session.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9._-]+$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                name:
                  type: string
                  description: Display name; defaults to username if omitted
      responses:
        "200":
          description: Account created and session started
          headers:
            Set-Cookie:
              description: Sets `better-auth.session_token` (HttpOnly) and `keeper.has_session=1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/username-only/sign-in:
    post:
      operationId: usernameSignIn
      summary: Sign in with username and password
      description: Active when `commercialMode` is false (self-hosted).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Sets `better-auth.session_token` (HttpOnly) and `keeper.has_session=1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/sign-up/email:
    post:
      operationId: emailSignUp
      summary: Sign up with email and password
      description: Active when `commercialMode` is true. Sends a verification email; session is not active until verified.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: Account created; verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"

  /api/auth/sign-in/email:
    post:
      operationId: emailSignIn
      summary: Sign in with email and password
      description: Active when `commercialMode` is true.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Sets `better-auth.session_token` (HttpOnly) and `keeper.has_session=1`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid credentials

  /api/auth/sign-in/social:
    post:
      operationId: socialSignIn
      summary: Initiate social OAuth sign-in
      description: Active when the relevant provider is enabled (check `socialProviders` in capabilities).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, callbackURL]
              properties:
                provider:
                  type: string
                  enum: [google, microsoft]
                callbackURL:
                  type: string
                  description: URL to redirect to after the OAuth flow completes
      responses:
        "302":
          description: Redirect to provider authorization URL

  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Invalidates the current session and clears all session cookies.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Signed out; session cookies cleared

  /api/auth/get-session:
    get:
      operationId: getSession
      summary: Get current session
      description: Returns the current session and user. If no valid session exists, clears stale cookies and returns null values.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current session (may contain null values if no active session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"

  /api/auth/list-sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: All active sessions for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthSession"

  /api/auth/revoke-session:
    post:
      operationId: revokeSession
      summary: Revoke a specific session
      tags: [Auth]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Session revoked

  /api/auth/revoke-other-sessions:
    post:
      operationId: revokeOtherSessions
      summary: Revoke all other sessions
      description: Revokes all sessions except the current one.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Other sessions revoked

  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: Change password
      tags: [Auth]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password changed
        "401":
          description: Current password incorrect

  /api/auth/forget-password:
    post:
      operationId: forgetPassword
      summary: Request password reset email
      description: Active when `supportsPasswordReset` is true in capabilities.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent if the address exists

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with token
      description: Active when `supportsPasswordReset` is true in capabilities.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset
        "400":
          description: Invalid or expired token

  /api/auth/delete-user:
    post:
      operationId: deleteUser
      summary: Delete authenticated user
      description: Permanently deletes the user account and all associated data.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: User deleted

  /api/auth/passkey/register:
    post:
      operationId: registerPasskey
      summary: Register a passkey
      description: Active when `supportsPasskeys` is true in capabilities. Requires an active session.
      tags: [Auth]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Passkey registered

  /api/auth/passkey/authenticate:
    post:
      operationId: authenticatePasskey
      summary: Authenticate with a passkey
      description: Active when `supportsPasskeys` is true in capabilities. No existing session required.
      tags: [Auth]
      responses:
        "200":
          description: Authenticated; session cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  # ---------------------------------------------------------------------------
  # Entitlements
  # ---------------------------------------------------------------------------
  /api/entitlements:
    get:
      operationId: getEntitlements
      summary: Get user entitlements
      description: Returns the authenticated user's plan limits and feature flags.
      tags: [Entitlements]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: User entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Accounts
  # ---------------------------------------------------------------------------
  /api/accounts:
    get:
      operationId: listAccounts
      summary: List calendar accounts
      tags: [Accounts]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of calendar accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    provider:
                      type: string
                    displayName:
                      type: string
                      nullable: true
                    email:
                      type: string
                      nullable: true
                    authType:
                      type: string
                    needsReauthentication:
                      type: boolean
                    calendarCount:
                      type: integer
        "401":
          description: Unauthorized

  /api/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAccount
      summary: Get a calendar account
      tags: [Accounts]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Calendar account
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAccount
      summary: Delete a calendar account
      tags: [Accounts]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ---------------------------------------------------------------------------
  # Sources
  # ---------------------------------------------------------------------------
  /api/sources:
    get:
      operationId: listSources
      summary: List all sources
      tags: [Sources]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeeperSource"
        "401":
          description: Unauthorized

  /api/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSource
      summary: Get a source
      tags: [Sources]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeeperSource"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    patch:
      operationId: updateSource
      summary: Update a source
      description: Pro plan required for event filter fields.
      tags: [Sources]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                customEventName:
                  type: string
                excludeAllDayEvents:
                  type: boolean
                excludeEventDescription:
                  type: boolean
                excludeEventLocation:
                  type: boolean
                excludeEventName:
                  type: boolean
                excludeFocusTime:
                  type: boolean
                excludeOutOfOffice:
                  type: boolean
                includeInIcalFeed:
                  type: boolean
                treatFullDayTimedEventsAsAllDay:
                  type: boolean
      responses:
        "200":
          description: Source updated
        "401":
          description: Unauthorized
        "402":
          description: Plan upgrade required
        "404":
          description: Not found

  /api/sources/{id}/destinations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSourceDestinations
      summary: Get destination IDs for a source
      tags: [Sources]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Destination IDs
          content:
            application/json:
              schema:
                type: object
                required: [destinationIds]
                properties:
                  destinationIds:
                    type: array
                    items:
                      type: string
        "401":
          description: Unauthorized
    put:
      operationId: setSourceDestinations
      summary: Set destinations for a source
      tags: [Sources]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarIds]
              properties:
                calendarIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Destinations updated
        "401":
          description: Unauthorized

  /api/sources/{id}/sources:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDestinationSources
      summary: Get source IDs mapped to a destination
      tags: [Sources]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Source IDs
          content:
            application/json:
              schema:
                type: object
                required: [sourceIds]
                properties:
                  sourceIds:
                    type: array
                    items:
                      type: string
        "401":
          description: Unauthorized
    put:
      operationId: setDestinationSources
      summary: Set sources for a destination
      tags: [Sources]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarIds]
              properties:
                calendarIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Sources updated
        "401":
          description: Unauthorized

  /api/sources/authorize:
    get:
      operationId: authorizeSource
      summary: Initiate OAuth for a source provider
      tags: [Sources]
      security:
        - sessionAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [google, outlook]
        - name: credentialId
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to provider authorization URL
        "401":
          description: Unauthorized

  /api/sources/callback/{provider}:
    get:
      operationId: sourceOAuthCallback
      summary: OAuth callback for source providers
      tags: [Sources]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to dashboard after handling the OAuth callback

  /api/sources/callback-state:
    get:
      operationId: getCallbackState
      summary: Consume a one-time callback state token
      tags: [Sources]
      security:
        - sessionAuth: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored state payload
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized

  # ---------------------------------------------------------------------------
  # Sources — Google
  # ---------------------------------------------------------------------------
  /api/sources/google:
    get:
      operationId: listGoogleSources
      summary: List Google Calendar sources
      tags: [Sources - Google]
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of Google sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeeperSource"
        "401":
          description: Unauthorized
    post:
      operationId: createGoogleSource
      summary: Create a Google Calendar source
      tags: [Sources - Google]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalCalendarId, name]
              properties:
                externalCalendarId:
