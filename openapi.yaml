                    type: string
                  name:
                    type: string
                  tokenPrefix:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  token:
                    type: string
                    description: The full token value. Shown only once — store it securely.
        "401":
          description: Unauthorized

